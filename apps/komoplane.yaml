apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: komoplane
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm-charts.komodor.io
    chart: komoplane
    targetRevision: 0.1.8
    helm:
      releaseName: komoplane
  destination:
    server: https://kubernetes.default.svc
    namespace: komoplane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
