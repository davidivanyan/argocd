apiVersion: batch/v1
kind: Job
metadata:
  name: vault-bootstrap
  namespace: vault
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: vault-bootstrap
    spec:
      serviceAccountName: vault
      restartPolicy: OnFailure
      containers:
        - name: vault-bootstrap
          image: hashicorp/vault:1.19
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN
              value: "root"
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Waiting for Vault to be ready..."
              until vault status > /dev/null 2>&1; do
                echo "Vault not ready, retrying in 5s..."
                sleep 5
              done
              echo "Vault is ready."

              # Enable KV v2 secrets engine (ignore if already enabled)
              vault secrets enable -path=secret -version=2 kv 2>/dev/null || true
              echo "KV v2 secrets engine enabled at secret/"

              # Enable Kubernetes auth method (ignore if already enabled)
              vault auth enable kubernetes 2>/dev/null || true
              echo "Kubernetes auth method enabled."

              # Configure Kubernetes auth to use the in-cluster API
              vault write auth/kubernetes/config \
                kubernetes_host="https://kubernetes.default.svc.cluster.local:443"
              echo "Kubernetes auth configured."

              # Create a policy that allows reading secrets
              vault policy write external-secrets - <<'POLICY'
              path "secret/data/*" {
                capabilities = ["read"]
              }
              path "secret/metadata/*" {
                capabilities = ["read", "list"]
              }
              POLICY
              echo "Policy 'external-secrets' created."

              # Create a role for the ESO service account
              vault write auth/kubernetes/role/external-secrets \
                bound_service_account_names=vault-auth \
                bound_service_account_namespaces=external-secrets \
                policies=external-secrets \
                ttl=1h
              echo "Role 'external-secrets' created."

              # Seed placeholder secrets (overwrite with real values later)
              vault kv put secret/crossplane/aws \
                creds="$(printf '[default]\naws_access_key_id = REPLACE_ME\naws_secret_access_key = REPLACE_ME')"
              echo "Placeholder secret 'secret/crossplane/aws' created."

              echo "Vault bootstrap complete!"
              echo ""
              echo "To set real AWS credentials, run:"
              echo "  vault kv put secret/crossplane/aws creds='[default]\\naws_access_key_id=XXX\\naws_secret_access_key=XXX'"
